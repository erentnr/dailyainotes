# For Alembic's own CLI during development, e.g. `uv run alembic revision -m "add topics"`.
# The app and `dan db upgrade` build the same configuration in dailyainotes/db/migrate.py.
# Migrations are written by hand; name them NNNN_<slug>.py with revision "NNNN".
[alembic]
script_location = dailyainotes.db:migrations
file_template = %%(rev)s_%%(slug)s
