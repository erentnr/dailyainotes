[project]
name = "dailyainotes"
version = "0.1.0"
description = "AI takes notes on what's happening, every day, on the things you care about."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.141.1",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings",
    "sqlalchemy[asyncio]>=2.1.1",
    "structlog",
    "tldextract>=5.3.2",
    "typer",
    "uvicorn>=0.54.0",
]

[project.scripts]
dan = "dailyainotes.cli:app"

[build-system]
requires = ["uv_build>=0.12.20,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "anyio>=4.15.1",
    "httpx2>=2.13.1",
    "mypy",
    "pre-commit>=4.6.2",
    "pytest",
    "ruff",
]

[tool.uv]
# INTENT.md, Dependency Policies: never resolve a release younger than two weeks.
exclude-newer = "2 weeks"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S", "PT", "T20"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --import-mode=importlib"
# A deprecation is a failure: the brief rules out deprecated APIs.
filterwarnings = ["error"]
markers = ["integration: needs Postgres from `make up`"]
