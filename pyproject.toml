[project]
name = "dailyainotes"
version = "0.1.0"
description = "AI takes notes on what's happening, every day, on the things you care about."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.141.1",
    "fastembed>=0.8.1",
    "feedparser>=6.0.14",
    "httpx2>=2.13.1",
    "langchain>=1.4.3",
    "langchain-core>=1.6.5",
    "langchain-ollama>=1.1.0",
    "langchain-openrouter>=0.2.9",
    "langfuse>=4.15.6",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-postgres>=3.1.2",
    "pgvector>=0.5.0",
    "procrastinate>=3.10.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings",
    "pyjwt[crypto]>=2.15.1",
    "sqlalchemy[asyncio]>=2.1.1",
    "structlog",
    "tldextract>=5.3.2",
    "trafilatura>=2.2.0",
    "typer",
    "uvicorn>=0.54.0",
]

[project.scripts]
dan = "dailyainotes.cli:app"
dan-worker = "dailyainotes.worker:main"

[build-system]
requires = ["uv_build>=0.12.20,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "anyio>=4.15.1",
    "mypy",
    "pre-commit>=4.6.2",
    "pytest",
    "ruff",
]

[tool.uv]
# INTENT.md, Dependency Policies: never resolve a release younger than two weeks.
exclude-newer = "2 weeks"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S", "PT", "T20"]

[tool.ruff.lint.per-file-ignores]
# Tests use asserts and made-up credentials.
"tests/**" = ["S101", "S106"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Ships no type information; its results are read as Any and turned into typed RawItems.
module = ["feedparser"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --import-mode=importlib"
# A deprecation is a failure: the brief rules out deprecated APIs.
filterwarnings = [
    "error",
    # langchain-core imports its Pydantic v1 shim at startup and warns on Python 3.14; we use
    # no Pydantic v1 API ourselves.
    "ignore:Core Pydantic V1 functionality isn't compatible with Python 3.14:UserWarning",
]
markers = ["integration: needs Postgres from `make up`"]
