# Production on the VPS: a Cloudflare Tunnel, Caddy, the site, the API, the worker and Postgres.
# It lives in /srv/dailyainotes next to the server's .env, which sets IMAGE, DOMAIN,
# POSTGRES_PASSWORD, TUNNEL_TOKEN and the app's settings (README, Deploy). deploy.sh sets TAG.
name: dailyainotes-prod

x-logging: &logging
  # Docker's default json-file driver never rotates; `local` does (5 files of 20 MB).
  driver: local

x-app: &app
  image: ${IMAGE:?}:${TAG:?}
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://dan:${POSTGRES_PASSWORD:?}@db:5432/dailyainotes
    # uvicorn takes the client address from X-Forwarded-For. Safe: only Caddy reaches the API.
    FORWARDED_ALLOW_IPS: "*"
    # Kept with eval runs.
    GIT_SHA: ${TAG:?}
    # Links in sign-in emails, and the origin reader requests must come from.
    SITE_URL: https://${DOMAIN:?}
  depends_on:
    db:
      condition: service_healthy
  restart: unless-stopped
  logging: *logging

services:
  # Connects out to Cloudflare and brings visitors to Caddy, so no container publishes a port
  # (INTENT.md, Security; ADR 0002).
  cloudflared:
    image: cloudflare/cloudflared:2026.9.3
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?}
    depends_on:
      - caddy
    restart: unless-stopped
    mem_limit: 64m
    logging: *logging

  caddy:
    image: caddy:2.11.7-alpine
    environment:
      DOMAIN: ${DOMAIN:?}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 64m
    logging: *logging

  web:
    image: ${IMAGE:?}-web:${TAG:?}
    environment:
      API_URL: http://api:8000
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:4321/').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 256m
    logging: *logging

  api:
    <<: *app
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    mem_limit: 640m

  worker:
    <<: *app
    command: ["dan-worker"]
    mem_limit: 1g

  db:
    image: pgvector/pgvector:0.8.7-pg18-trixie
    environment:
      POSTGRES_USER: dan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: dailyainotes
    command: ["postgres", "-c", "shared_buffers=512MB"]
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/18/docker.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dan -d dailyainotes"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    mem_limit: 1280m
    shm_size: 256m
    logging: *logging

volumes:
  pgdata:
