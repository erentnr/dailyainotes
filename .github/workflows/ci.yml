name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    services:
      db:
        # Same image as docker-compose.yml.
        image: pgvector/pgvector:0.8.7-pg18-trixie
        env:
          POSTGRES_USER: dan
          POSTGRES_PASSWORD: dan
          POSTGRES_DB: dailyainotes
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dan -d dailyainotes"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgresql+psycopg://dan:dan@localhost:5432/dailyainotes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the whole history

      - name: Scan the history for secrets
        run: >-
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1
          git /repo --redact --verbose

      # uv 0.12.20 and setup-uv v10.2.0: the newest releases at least two weeks old on 2026-10-12.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.20"
          enable-cache: true

      - run: uv sync --locked

      - name: pre-commit hooks
        run: uv run --frozen pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: gitleaks # the history scan above covers it

      - run: make check

      # The 30-question eval, without a model; fails below evals/baseline.json.
      - run: uv run --frozen dan evals run

      # The site's API types come from this schema: it must match the API.
      - name: OpenAPI schema is current
        run: |
          uv run --frozen python -c "import json; from dailyainotes.api.app import create_app; from dailyainotes.settings import Settings; print(json.dumps(create_app(Settings(_env_file=None)).openapi(), indent=1))" > web/openapi.json
          git diff --exit-code web/openapi.json

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # setup-node v7.0.0: the newest release at least two weeks old on 2026-10-13.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"

      # pnpm at the version package.json names.
      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      - name: API types are generated from the schema
        run: |
          pnpm run api-types
          git diff --exit-code src/lib/api/schema.d.ts

      - run: pnpm run check

      - run: pnpm run build

  image:
    # Built on every run so a broken Dockerfile fails the pull request; pushed only from main.
    needs: [check, web]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Docker tags must be lower case; the repository name may not be.
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - if: env.PUSH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: web
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ env.IMAGE }}-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: image
    runs-on: ubuntu-24.04
    environment: production
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      # A secret, not a variable, so the server's address stays out of the public logs. The steps
      # are skipped until it is set (README, Deploy); a job's `if` cannot read secrets.
      HOST: ${{ secrets.DEPLOY_HOST }}
      TAG: ${{ github.sha }}
    steps:
      - if: env.HOST != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Deploy over SSH
        if: env.HOST != ''
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          scp deploy/compose.prod.yml deploy/Caddyfile deploy/*.sh "deploy@$HOST:/srv/dailyainotes/"
          # TAG expands here, on the runner, on purpose.
          # shellcheck disable=SC2029
          ssh "deploy@$HOST" "/srv/dailyainotes/deploy.sh $TAG"
