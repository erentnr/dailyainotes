# The fixed topic catalog (ADR 0001). `dan catalog sync` loads it into the database; it adds
# and updates, never deletes. Topics listed with sources here are active; the others wait for
# the Topic Planner (M2) to propose their sources.
#
# Publisher kinds set the starting trust (src/dailyainotes/domain/trust.py). Publishers with
# the same owner_group are not independent of each other.

[[publishers]]
domain = "formula1.com"
name = "Formula 1"
kind = "primary"

[[publishers]]
domain = "autosport.com"
name = "Autosport"
kind = "editorial"
owner_group = "motorsport-network"

[[publishers]]
domain = "motorsport.com"
name = "Motorsport.com"
kind = "editorial"
owner_group = "motorsport-network"

[[publishers]]
