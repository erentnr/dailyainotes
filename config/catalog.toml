[[topics]]
slug = "formula-1"
name = "Formula 1"
description = "Races, teams, rule changes"
sources = [
  { type = "rss", url = "https://www.formula1.com/en/latest/all.xml" },
  { type = "rss", url = "https://www.autosport.com/rss/f1/news/" },
  { type = "rss", url = "https://www.motorsport.com/rss/f1/news/" },
  { type = "rss", url = "https://www.racefans.net/feed/" },
  { type = "rss", url = "https://www.the-race.com/feed/" },
  { type = "rss", url = "https://feeds.bbci.co.uk/sport/formula1/rss.xml", publisher = "bbc.co.uk" },
]

[[topics]]
slug = "open-weight-ai-models"
name = "Open-weight AI models"
description = "Releases with downloadable weights: licences, training recipes, evaluations"
sources = [
  { type = "rss", url = "https://huggingface.co/blog/feed.xml" },
  { type = "arxiv", query = 'abs:"open-weight" OR abs:"open weights"' },
  { type = "github_releases", repo = "vllm-project/vllm" },
  { type = "hackernews", query = "open weights", min_points = 50 },
]

